name: Windows desktop installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (for example 1.2.0)
        required: true
        default: "1.2.0"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) { $version = (Get-Content desktop/windows/versions.json -Raw | ConvertFrom-Json).installer_version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "invalid version '$version'" }
          ./desktop/windows/build.ps1 -AppSource "$env:GITHUB_WORKSPACE" -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuteurFrame-Setup
          path: |
            desktop/windows/dist/AuteurFrame-Setup-*.exe
            desktop/windows/dist/AuteurFrame-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:TAG" (Get-ChildItem desktop/windows/dist -Filter 'AuteurFrame-Setup-*').FullName --clobber --repo "$env:GITHUB_REPOSITORY"
